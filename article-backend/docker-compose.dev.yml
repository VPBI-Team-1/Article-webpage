services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder       # Use builder stage — no need for full prod build
    command: sh -c "npx prisma db push && npx tsx watch src/index.ts"
    volumes:
      - .:/app              # Bind-mount source code for hot-reload
      - /app/node_modules   # Keep container's node_modules, not the host's
    environment:
      PORT: 8000
      DATABASE_URL: "mysql://article_user:article_password@db:3306/article_db"
      JWT_SECRET: "dev-secret-change-in-production"
