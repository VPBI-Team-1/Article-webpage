services:
  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: rootpassword
      MARIADB_DATABASE: article_db
      MARIADB_USER: article_user
      MARIADB_PASSWORD: article_password
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      PORT: 8000
      DATABASE_URL: "mysql://article_user:article_password@db:3306/article_db"
      JWT_SECRET: "change-me-in-production-use-a-strong-secret"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
